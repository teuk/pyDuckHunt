[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyduckhunt"
version = "0.1.0.dev0"
description = "A beta, deterministic and replayable Duck Hunt game bot for IRC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "CC-BY-NC-SA-3.0"
keywords = ["irc", "bot", "game", "duck-hunt", "event-sourcing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat :: Internet Relay Chat",
]

[project.urls]
Homepage = "https://github.com/teuk/pyDuckHunt"
Documentation = "https://github.com/teuk/pyDuckHunt/tree/main/docs"
Issues = "https://github.com/teuk/pyDuckHunt/issues"
Source = "https://github.com/teuk/pyDuckHunt"

[project.scripts]
pyduckhunt = "pyduckhunt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
