name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree:
    name: Public tree
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Enforce publishable-tree policy
        run: python tools/project_guard.py

  fast:
    name: Python ${{ matrix.python-version }} fast lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Public-tree policy
        run: python tools/project_guard.py

      - name: Syntax
        run: python -m compileall -q src tools tests

      - name: Fast lane
        env:
          PYTHONPATH: src
        run: python tools/validate.py --lane fast --progress

  full:
    name: Python 3.13 full lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Full validation lane
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python tools/validate.py --lane full --progress

  package:
    name: Install ${{ matrix.language }} / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [en, fr]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run the safe beta installer
        run: ./install.sh --language ${{ matrix.language }}

      - name: Exercise installed command
        run: .venv/bin/pyduckhunt --help

      - name: Check installed package and disabled private configuration
        run: .venv/bin/python -B tools/check_installed.py --language ${{ matrix.language }}

      - name: Preserve configuration on reinstall and reject a conflicting language
        env:
          EXPECTED_LANGUAGE: ${{ matrix.language }}
        shell: bash
        run: |
          set -Eeuo pipefail
          saved_config="$RUNNER_TEMP/pyduckhunt-config-before.toml"
          install -m 600 config/pyduckhunt.toml "$saved_config"
          ./install.sh
          cmp --silent "$saved_config" config/pyduckhunt.toml
          other_language=en
          if [[ "$EXPECTED_LANGUAGE" == en ]]; then other_language=fr; fi
          if ./install.sh --language "$other_language"; then
            echo '[KO] Conflicting language was accepted.'
            exit 1
          fi
          cmp --silent "$saved_config" config/pyduckhunt.toml
          .venv/bin/python -B tools/check_installed.py --language "$EXPECTED_LANGUAGE"
