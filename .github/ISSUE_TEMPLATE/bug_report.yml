name: Bug report
description: Report a reproducible pyDuckHunt defect without private IRC data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, hostmasks, private logs, state files or real player identities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0-dev or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Game engine
        - IRC transport
        - Persistence and replay
        - Partyline
        - Packaging and service
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic data
      description: Provide the smallest safe sequence that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, hostmasks, private logs, state and real identities.
          required: true
